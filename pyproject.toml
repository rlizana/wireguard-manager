[project]
name = "wgm"
dynamic = ["version"]
description = "WireGuard Manager (wgm) is a command-line tool designed to simplify the management of WireGuard VPN users."
authors = [
    { name = "Roberto Lizana", email = "rober.lizana@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clifire>=0.2.0",
    "qrcode>=8.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
wgm = "wgm.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "wgm/__version__.py"
pattern = "__version__ = '(?P<version>[^']+)'"

[tool.hatch.build.targets.wheel]
packages = ["wgm"]

[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = [".hermes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["dist", "build", ".venv", "tests/sample"]
